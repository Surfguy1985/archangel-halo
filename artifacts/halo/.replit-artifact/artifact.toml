kind = "web"
previewPath = "/"
title = "HALO — Archangel Operations"
version = "1.0.0"
id = "artifacts/halo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19529

[services.development]
run = "pnpm --filter @workspace/halo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/halo", "run", "build" ]
publicDir = "artifacts/halo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19529"
BASE_PATH = "/"
