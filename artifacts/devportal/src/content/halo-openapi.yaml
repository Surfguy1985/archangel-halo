        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - BearerKey: []
      - OAuth2:
        - workspace:read
    post:
      summary: Create partner tenant
      tags:
      - Partners
      responses:
        '200':
          description: Success
          content:
