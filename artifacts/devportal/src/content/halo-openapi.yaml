openapi: 3.1.0
info:
  title: HALO Composable Business OS API
  version: 2.1.0
  summary: API-first business management platform exposed as modular Legos.
  description: Canonical API contract for partner provisioning, module entitlements,
    embedded components, business operations, accounting, tax readiness, automation
    and metering. This is a proposed implementation specification and must be finalized
    during engineering discovery. Billing and collection endpoints updated for user-tier
    pricing, Stripe collection and enterprise routing.
  contact:
    name: HALO Platform Engineering
servers:
- url: https://api.sandbox.halo.example
  description: Sandbox
- url: https://api.halo.example
  description: Production
tags:
- name: Catalog
- name: Partners
- name: Entitlements
- name: Authentication
- name: Workspaces
- name: Embedded UI
- name: Identity
- name: Business Profile
- name: CRM
- name: Sales
- name: Money
- name: Banking
- name: Books
- name: Tax
- name: Work
- name: Team
- name: Documents
- name: Analytics
- name: Automation
- name: AI
- name: Notifications
- name: Integrations
- name: Webhooks
- name: Events
- name: Billing
paths:
  /v1/catalog/modules:
    get:
      summary: List available HALO modules
      tags:
      - Catalog
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Module'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/catalog/components:
