components:
  securitySchemes:
    BearerKey:
      type: http
      scheme: bearer
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.halo.example/oauth/authorize
          tokenUrl: https://auth.halo.example/oauth/token
          scopes:
            workspace:read: Read workspace data
            workspace:write: Modify workspace data
            books:read: Read accounting data
            books:write: Modify accounting data
            tax:read: Read tax readiness data
            tax:write: Modify tax readiness workflows
        clientCredentials:
          tokenUrl: https://auth.halo.example/oauth/token
          scopes:
            partner:admin: Manage downstream workspaces
            usage:read: Read usage and billing
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        request_id:
          type: string
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
        request_id:
          type: string
    Module:
      type: object
      properties:
        id: &id010
          type: string
          format: uuid
        created_at: &id009
          type: string
          format: date-time
        updated_at: *id009
        metadata: &id011
          type: object
          additionalProperties: true
        key:
          type: string
        name:
          type: string
        description:
          type: string
        components:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - beta
          - deprecated
    Component:
      type: object
      properties:
        id: *id010
        created_at: *id009
        updated_at: *id009
        metadata: *id011
        key:
          type: string
        module:
          type: string
