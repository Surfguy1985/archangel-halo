kind = "web"
previewPath = "/devportal/"
title = "HALO Developer Portal"
version = "1.0.0"
id = "artifacts/devportal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/devportal/" ]
localPort = 23679

[services.development]
run = "pnpm --filter @workspace/devportal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devportal", "run", "build" ]
publicDir = "artifacts/devportal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23679"
BASE_PATH = "/devportal/"
