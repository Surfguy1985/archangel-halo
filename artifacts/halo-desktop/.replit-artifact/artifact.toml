kind = "web"
previewPath = "/desktop/"
title = "HALO Desktop — Archangel Operations"
version = "1.0.0"
id = "artifacts/halo-desktop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/desktop/" ]
localPort = 20659

[services.development]
run = "pnpm --filter @workspace/halo-desktop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/halo-desktop", "run", "build" ]
publicDir = "artifacts/halo-desktop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20659"
BASE_PATH = "/desktop/"
