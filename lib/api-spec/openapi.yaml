        imageUrl: { type: ["string", "null"], description: "Uploaded map image, null = plain grid" }
        canEdit: { type: boolean }
        unitTarget: { type: ["number", "null"], description: "The property's known unit count" }
        extracted: { type: ["number", "null"], description: "Boxes AI-extracted on the last image upload" }
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitStatusRec"
    UnitMapImageInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, description: "Object storage path from the upload flow (/objects/...)" }
        contentType: { type: ["string", "null"] }
        extract: { type: boolean, default: true, description: "Run AI unit extraction on the image" }
    UnitGridInput:
      type: object
      properties:
        count: { type: ["number", "null"], description: "Units to generate; defaults to the property's unit count" }
        startAt: { type: ["number", "null"], description: "First unit number, default 101" }
        replace: { type: boolean, default: false, description: "Replace the existing layout" }
    UnitBoxInput:
      type: object
      required: [label]
      properties:
        label: { type: string }
        x: { type: ["number", "null"] }
        y: { type: ["number", "null"] }
        w: { type: ["number", "null"] }
        h: { type: ["number", "null"] }
    UnitBoxUpdate:
      type: object
      properties:
        label: { type: ["string", "null"] }
        x: { type: ["number", "null"] }
        y: { type: ["number", "null"] }
        w: { type: ["number", "null"] }
        h: { type: ["number", "null"] }
    UnitSmartLink:
      type: object
      required: [label, url, kind]
      properties:
        label: { type: string }
        url: { type: string }
        kind: { type: string, description: "tracker | summary | recap | photos | invoice | board" }
    UnitSummaryView:
      type: object
      required: [unitLabel, status, summary, facts, links, photos]
      properties:
        unitLabel: { type: string }
        status: { type: string, description: "red | yellow | green" }
        summary: { type: string, description: "AI-composed plain-language summary of current activity" }
        facts:
          type: array
          items: { type: string }
        links:
          type: array
          items:
            $ref: "#/components/schemas/UnitSmartLink"
        photos:
          type: array
          items:
            type: object
            required: [url, phase]
            properties:
              url: { type: string }
              phase: { type: ["string", "null"] }
    HubItemRec:
      type: object
      required: [id, section, title, createdAt]
      properties:
        id: { type: string }
        section: { type: string, description: "link | doc | card | employee | maintenance" }
        title: { type: string }
        subtitle: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        fileUrl: { type: ["string", "null"], description: "Served URL for an uploaded doc" }
        body: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        createdBy: { type: ["string", "null"] }
        createdAt: { type: string }
    ClientHubView:
      type: object
      required: [propertyName, canEdit, items]
      properties:
        propertyName: { type: string }
        canEdit: { type: boolean }
        items:
          type: array
          items:
            $ref: "#/components/schemas/HubItemRec"
    HubItemInput:
      type: object
      required: [section, title]
      properties:
        section: { type: string }
        title: { type: string }
        subtitle: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        storagePath: { type: ["string", "null"] }
        body: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
    HubItemUpdate:
      type: object
      properties:
        title: { type: ["string", "null"] }
        subtitle: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        storagePath: { type: ["string", "null"] }
        body: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
    MaintenancePingInput:
      type: object
      required: [message]
      properties:
        message: { type: string }
        unitNo: { type: ["string", "null"] }
        contactName: { type: ["string", "null"] }
    MaintenancePingResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    BoardColumn:
      type: string
      enum: [inbox, todo, in_progress, done]

    ClientCardModule:
      description: "Every interactive card module, discriminated on `type`. Adding a module = add a schema here and an entry in the mapping; orval then emits a narrowed union."
      oneOf:
        - $ref: "#/components/schemas/InvoiceModule"
        - $ref: "#/components/schemas/InvoiceBatchModule"
        - $ref: "#/components/schemas/BidModule"
        - $ref: "#/components/schemas/DocumentModule"
        - $ref: "#/components/schemas/TrackerModule"
        - $ref: "#/components/schemas/CrewMapModule"
        - $ref: "#/components/schemas/FlagsModule"
        - $ref: "#/components/schemas/PhotosModule"
        - $ref: "#/components/schemas/SummaryModule"
        - $ref: "#/components/schemas/ReferralModule"
        - $ref: "#/components/schemas/LinkModule"
      discriminator:
        propertyName: type
        mapping:
          invoice: "#/components/schemas/InvoiceModule"
          invoice_batch: "#/components/schemas/InvoiceBatchModule"
          bid: "#/components/schemas/BidModule"
          document: "#/components/schemas/DocumentModule"
          tracker: "#/components/schemas/TrackerModule"
          crewmap: "#/components/schemas/CrewMapModule"
          flags: "#/components/schemas/FlagsModule"
          photos: "#/components/schemas/PhotosModule"
          summary: "#/components/schemas/SummaryModule"
          referral: "#/components/schemas/ReferralModule"
          link: "#/components/schemas/LinkModule"

    InvoiceModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [invoice] }
        invoiceNo: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
        status: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"], description: "YYYY-MM-DD" }
        pdfUrl: { type: ["string", "null"] }
        payUrl: { type: ["string", "null"] }
        canApprove: { type: ["boolean", "null"] }
        approvedAt: { type: ["string", "null"] }
        payMethod: { type: ["string", "null"], description: "ach | check once chosen" }
        poNumber: { type: ["string", "null"] }
        requestedBudget: { type: ["number", "null"], description: "Budget from the originating client work request, for the billed-vs-requested check" }
        disputedAt: { type: ["string", "null"] }
        disputeNote: { type: ["string", "null"] }
        disputedBy: { type: ["string", "null"] }
        disputeResolvedAt: { type: ["string", "null"], description: "Set when the office clears a dispute" }
        disputeResponse: { type: ["string", "null"], description: "Office note back to the client when the dispute was cleared" }
        photoUrls:
          type: ["array", "null"]
          items: { type: string }
        lineItems:
          type: ["array", "null"]
          items:
            type: object
            properties:
              label: { type: string }
              unitNo: { type: ["string", "null"] }
              qty: { type: ["number", "null"] }
              amount: { type: ["number", "null"] }

    InvoiceBatchModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [invoice_batch] }
        unpaidAmount: { type: ["number", "null"] }
        count: { type: ["number", "null"] }
        invoices:
          type: ["array", "null"]
          items:
            type: object
            properties:
              invoiceNo: { type: ["string", "null"] }
              amount: { type: ["number", "null"] }
              status: { type: ["string", "null"] }
              payUrl: { type: ["string", "null"] }

    BidModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [bid] }
        status: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
        scope: { type: ["string", "null"] }
        pdfUrl: { type: ["string", "null"] }
        lineItems:
          type: ["array", "null"]
          items:
            type: object
            properties:
              service: { type: ["string", "null"] }
              qty: { type: ["number", "null"] }
              amount: { type: ["number", "null"] }

    DocumentModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [document] }
        label: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        isPdf: { type: ["boolean", "null"] }

    TrackerModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [tracker] }
        jobNo: { type: ["string", "null"] }
        unitNo: { type: ["string", "null"] }
        scope: { type: ["string", "null"] }
        trackerUrl: { type: ["string", "null"] }

    CrewMapModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [crewmap] }
        onSiteCount: { type: ["number", "null"] }
        crews:
          type: ["array", "null"]
          items:
            type: object
            properties:
              crewName: { type: ["string", "null"] }
              crewTrade: { type: ["string", "null"] }
              description: { type: ["string", "null"] }
              unitNo: { type: ["string", "null"] }
              onSite: { type: ["boolean", "null"] }
              selfieUrl: { type: ["string", "null"] }

    FlagsModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [flags] }
        totalCount: { type: ["number", "null"] }
        requestedAt: { type: ["string", "null"] }
        canSchedule: { type: ["boolean", "null"] }
        items:
          type: ["array", "null"]
          items:
            type: object
            properties:
              label: { type: ["string", "null"] }
              unit: { type: ["string", "null"] }

    PhotosModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [photos] }
        jobId: { type: ["string", "null"] }
        jobNo: { type: ["string", "null"] }
        unitNo: { type: ["string", "null"] }
        totalCount: { type: ["number", "null"] }
        photoUrls:
          type: ["array", "null"]
          items: { type: string }

    SummaryModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [summary] }
        summaryId: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        result: { type: ["string", "null"] }
        unitNo: { type: ["string", "null"] }
        serviceDate: { type: ["string", "null"] }
        summaryUrl: { type: ["string", "null"] }
        checkedCount: { type: ["number", "null"] }
        itemCount: { type: ["number", "null"] }
        flagCount: { type: ["number", "null"] }
        photoCount: { type: ["number", "null"] }

    ReferralModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [referral] }
        referredAt: { type: ["string", "null"] }
        canRefer: { type: ["boolean", "null"] }

    LinkModule:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [link] }
        label: { type: ["string", "null"] }
        url: { type: ["string", "null"] }

    CardApproveAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve] }
        name: { type: ["string", "null"], description: "Approver name if collected" }
        note: { type: ["string", "null"] }

    CardPayMethodAction:
      type: object
      required: [action, method]
      properties:
        action: { type: string, enum: [pay_method] }
        method: { type: string, enum: [ach, check] }

    CardScheduleAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [schedule] }
        name: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        unitNo: { type: ["string", "null"] }
        neededBy: { type: ["string", "null"], description: "YYYY-MM-DD" }

    CardReferAction:
      type: object
      required: [action, contact]
      properties:
        action: { type: string, enum: [refer] }
        contact: { type: string, description: "Referral contact — email or phone" }
        name: { type: ["string", "null"] }
        note: { type: ["string", "null"] }

    CardAcknowledgeAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [acknowledge] }
        note: { type: ["string", "null"] }

    CardDisputeAction:
      type: object
      required: [action, note]
      properties:
        action: { type: string, enum: [dispute] }
        note: { type: string, description: "One-field dispute reason — lands office-side as a flagged item" }
        name: { type: ["string", "null"] }

    BoardEvent:
      type: object
      required: [event, propertyId, at]
      description: "Payload of every SSE `board` event and every outbound webhook mirror. Emitted from the board_events outbox after commit."
      properties:
        event:
          type: string
          enum: [card_pushed, card_moved, card_action, card_commented, card_removed, inbox_raised, inbox_responded]
        propertyId: { type: string }
        cardId: { type: ["string", "null"] }
        cardKey: { type: ["string", "null"] }
        actor:
          type: ["string", "null"]
          enum: [client, office, crew, system, null]
        at: { type: string, description: "ISO timestamp" }
