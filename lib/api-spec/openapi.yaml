  /admin/accounts/{propertyId}/board/events:
    get:
      security: [{ adminSession: [] }]
      operationId: streamOfficeBoardEvents
      tags: [admin]
      summary: SSE stream — office mirror of a property's board. Emits `board` events; reconnect then refetch to catch up.
      parameters:
        - name: propertyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of BoardEvent payloads
          content:
            text/event-stream:
              schema: { type: string }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /client/{token}/board/events:
    get:
      operationId: streamClientBoardEvents
      tags: [clients]
      summary: SSE stream — live board updates for the property (same event vocabulary as the office stream)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of BoardEvent payloads
          content:
            text/event-stream:
              schema: { type: string }
        "404":
          description: Invalid link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /client/{token}/session:
    post:
      operationId: exchangeClientToken
      tags: [clients]
      summary: Exchange the emailed capability link for an httpOnly session cookie so the token stops traveling on every request
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Session cookie set (halo_client_session; httpOnly, SameSite=Strict)
        "404":
          description: Invalid link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /client/{token}/concierge:
    post:
      operationId: conciergeChat
      tags: [clients]
      summary: Concierge chat — streams status + answer text as SSE; mutations return confirm chips, nothing writes until confirmed
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeChatInput"
      responses:
        "200":
          description: text/event-stream of status/delta/done events
          content:
            text/event-stream:
              schema: { type: string }
        "404":
          description: Invalid link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /client/{token}/concierge/history:
    get:
      operationId: getConciergeHistory
      tags: [clients]
      summary: Recent concierge conversation for the signed-in client user
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeHistory"
        "404":
          description: Invalid link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /client/{token}/concierge/confirm:
    post:
      operationId: confirmConciergeAction
      tags: [clients]
      summary: Execute a concierge-proposed action — runs through the same endpoint the equivalent button uses
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeConfirmInput"
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeConfirmResult"
        "400":
          description: Invalid or expired confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: halo_admin_session
      description: "Office/admin session. All /admin/* operations require it."
    clientSession:
      type: apiKey
      in: cookie
      name: halo_client_session
      description: "Client board session, minted by POST /client/{token}/session. During migration the path token is still honored; new surfaces should rely on the cookie."
  schemas:
    ConciergeChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 2000 }
    ConciergeChip:
      type: object
      required: [id, label, summary, confirmToken, expiresAt]
      properties:
        id: { type: string }
        label: { type: string }
        summary: { type: string }
        confirmToken: { type: string }
        expiresAt: { type: string }
    ConciergeMessage:
      type: object
      required: [id, role, content, chips, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        chips:
          type: array
          items:
            $ref: "#/components/schemas/ConciergeChip"
        createdAt: { type: string }
    ConciergeHistory:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConciergeMessage"
    ConciergeConfirmInput:
      type: object
      required: [confirmToken]
      properties:
        confirmToken: { type: string }
    ConciergeConfirmResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        blocked: { type: boolean }
        message: { type: string }
    SummaryChecklistSection:
      type: object
      required: [section, items]
      properties:
        section: { type: string }
        items:
          type: array
          items:
            type: object
            required: [label, checked]
            properties:
              label: { type: string }
              checked: { type: boolean }
    SummaryFlagItem:
      type: object
      required: [label, checked, note]
      properties:
        label: { type: string }
        checked: { type: boolean }
        note: { type: string }
    SummaryPhotoRef:
      type: object
      required: [phase, path, url]
      properties:
        phase: { type: string, description: "before | after | progress" }
        path: { type: string }
        url: { type: string }
    JobSummaryDoc:
      type: object
      required: [jobId, propertyId, exists, title, checklist, flags, overallResult, photos, status]
      properties:
        jobId: { type: string }
        propertyId: { type: string }
        exists: { type: boolean, description: "false when this is an unsaved prefit draft" }
        token: { type: ["string", "null"] }
        shareUrl: { type: ["string", "null"] }
        title: { type: string }
        unitNumber: { type: ["string", "null"] }
        serviceDate: { type: ["string", "null"] }
        crewLead: { type: ["string", "null"] }
        timeIn: { type: ["string", "null"] }
        timeOut: { type: ["string", "null"] }
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/SummaryChecklistSection"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/SummaryFlagItem"
        observations: { type: ["string", "null"] }
        touchUpNotes: { type: ["string", "null"] }
        overallResult: { type: string, description: "exceeded | met | followup" }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/SummaryPhotoRef"
        status: { type: string, description: "draft | sent" }
        sentTo: { type: ["string", "null"] }
        sentAt: { type: ["string", "null"] }
        propertyName: { type: ["string", "null"] }
        propertyAddress: { type: ["string", "null"] }
        business:
          type: object
          properties:
            companyName: { type: ["string", "null"] }
            phone: { type: ["string", "null"] }
            email: { type: ["string", "null"] }
    JobSummaryEditor:
      type: object
      required: [doc, availablePhotos, suggestedRecipient]
      properties:
        doc:
          $ref: "#/components/schemas/JobSummaryDoc"
        availablePhotos:
          type: array
          items:
            $ref: "#/components/schemas/SummaryPhotoRef"
        suggestedRecipient: { type: ["string", "null"], description: "Property billing/contact email to prefill the send field" }
    JobSummarySaveInput:
      type: object
      properties:
        title: { type: string }
        unitNumber: { type: ["string", "null"] }
        serviceDate: { type: ["string", "null"] }
        crewLead: { type: ["string", "null"] }
        timeIn: { type: ["string", "null"] }
        timeOut: { type: ["string", "null"] }
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/SummaryChecklistSection"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/SummaryFlagItem"
        observations: { type: ["string", "null"] }
        touchUpNotes: { type: ["string", "null"] }
        overallResult: { type: string }
        photos:
          type: array
          items:
            type: object
            required: [phase, path]
            properties:
              phase: { type: string }
              path: { type: string }
    JobSummarySendInput:
      type: object
      required: [to]
      properties:
        to: { type: string }
        message: { type: ["string", "null"] }
    JobSummaryPublicDoc:
      type: object
      required: [title, checklist, overallResult, photos]
      properties:
        title: { type: string }
        unitNumber: { type: ["string", "null"] }
        serviceDate: { type: ["string", "null"] }
        crewLead: { type: ["string", "null"] }
        timeIn: { type: ["string", "null"] }
        timeOut: { type: ["string", "null"] }
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/SummaryChecklistSection"
        observations: { type: ["string", "null"] }
        touchUpNotes: { type: ["string", "null"] }
        overallResult: { type: string }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/SummaryPhotoRef"
        propertyName: { type: ["string", "null"] }
        propertyAddress: { type: ["string", "null"] }
        business:
          type: object
          properties:
            companyName: { type: ["string", "null"] }
            phone: { type: ["string", "null"] }
            email: { type: ["string", "null"] }
    JobSummaryPublicView:
      type: object
      required: [doc, flaggedItems, hasBoard]
      properties:
        doc:
          $ref: "#/components/schemas/JobSummaryPublicDoc"
        flaggedItems:
          type: array
          items: { type: string }
        hasBoard: { type: boolean, description: "true once the PM's own community box view (CMS) is set up" }
    ClientAccountRec:
      type: object
      required: [id, propertyId, tier, userSeats, guestSeats, status, dashboardToken, onboardingStatus]
      properties:
        id: { type: string }
        propertyId: { type: string }
        tier: { type: string, description: "basic | pro | enterprise" }
        userSeats: { type: number }
        guestSeats: { type: number }
        status: { type: string, description: "active | paused | cancelled" }
        notes: { type: ["string", "null"] }
        logoPath: { type: ["string", "null"] }
        servicesOverview: { type: ["string", "null"] }
        dashboardToken: { type: string }
        dashboardUrl: { type: ["string", "null"], description: "Full public URL to the client dashboard" }
        notifyNewCards: { type: boolean, description: "Email the billing contact a batched digest when new cards land on the board" }
        onboardingStatus: { type: string, description: "not_sent | sent" }
        onboardingSentAt: { type: ["string", "null"] }
    ClientAccountSummary:
      type: object
      required: [propertyId, propertyName, tier, status, userSeatsUsed, userSeats, guestSeats, onboardingStatus, hasAccount]
      properties:
        propertyId: { type: string }
        propertyName: { type: string }
        pmcName: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        units: { type: ["number", "null"] }
        logoPath: { type: ["string", "null"] }
        tier: { type: string }
        status: { type: string }
        userSeatsUsed: { type: number }
        userSeats: { type: number }
        guestSeats: { type: number }
        onboardingStatus: { type: string }
        hasAccount: { type: boolean, description: "false until subscription settings are first saved" }
    ClientUserRec:
      type: object
      required: [id, propertyId, name, email, role, active, createdAt]
      properties:
        id: { type: string }
        propertyId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, description: "admin | member | guest" }
        active: { type: boolean }
        lastPasswordResetAt: { type: ["string", "null"] }
        createdAt: { type: string }
    ClientAccountDetail:
      type: object
      required: [account, users, sends, property, contacts, services]
      properties:
        account:
          $ref: "#/components/schemas/ClientAccountRec"
        users:
          type: array
          items:
            $ref: "#/components/schemas/ClientUserRec"
        sends:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingSendRec"
        property:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            pmcName: { type: ["string", "null"] }
            address: { type: ["string", "null"] }
            city: { type: ["string", "null"] }
            units: { type: ["number", "null"] }
            brief: { type: ["string", "null"] }
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        services:
          type: array
          items:
            $ref: "#/components/schemas/PriceItem"
    ClientFeature:
      type: object
      required: [key, label, description]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
    ClientAccessUser:
      type: object
      required: [id, name, email, role, active, permissions, customized]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, description: "admin | member | guest" }
        active: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        customized:
          type: boolean
          description: False while the user still follows their role's defaults
    ClientSeatUsage:
      type: object
      required: [tier, userSeats, guestSeats, usedSeats, usedGuestSeats]
      properties:
        tier: { type: string, description: "basic | pro | enterprise" }
        userSeats: { type: integer }
        guestSeats: { type: integer }
        usedSeats: { type: integer, description: Active admin+member logins }
        usedGuestSeats: { type: integer }
    ClientAccessSetupInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string, minLength: 8 }
    ClientAccessInviteInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string }
        role: { type: string, description: "admin | member | guest" }
