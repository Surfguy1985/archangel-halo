        kind:
          type: string
          description: "What raised the card. Note: kind `flag` carries a module of type `flags` (legacy plural; kept for stored-card compatibility)."
          enum: [invoice, invoice_batch, payment_request, bid, document, tracker, crewmap, flag, photos, summary, referral, manual]
        title: { type: string }
        body: { type: ["string", "null"] }
        actionLabel: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
