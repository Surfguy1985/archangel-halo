components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Brief:
      type: object
      required: [body, when, needsYou, generatedAt]
      properties:
        body: { type: string }
        when: { type: string }
        needsYou: { type: integer }
        generatedAt: { type: string }

    FeedCard:
      type: object
      required: [id, queue, tier, title, sub]
      properties:
        id: { type: string }
        queue: { type: string }
        tier: { type: string, description: "now | today | week | handled" }
        title: { type: string }
        sub: { type: string }
        entityType: { type: ["string", "null"] }
        entityId: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
        meta:
          type: array
          items:
            $ref: "#/components/schemas/CardChip"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/CardAction"
    CardChip:
      type: object
      required: [label]
      properties:
        label: { type: string }
        mono: { type: ["boolean", "null"] }
        warn: { type: ["boolean", "null"] }
        gold: { type: ["boolean", "null"] }
    CardAction:
      type: object
      required: [label, action, kind]
      properties:
        label: { type: string }
        action: { type: string }
        kind: { type: string, description: "gold | ghost | line" }
    TodayPayload:
      type: object
      required: [date, brief, feed, queues, unreadNotifications]
      properties:
        date: { type: string }
        brief:
          $ref: "#/components/schemas/Brief"
        feed:
          type: array
          items:
            $ref: "#/components/schemas/FeedCard"
        queues:
          type: array
          items:
            $ref: "#/components/schemas/Queue"
        unreadNotifications: { type: integer }
    Queue:
      type: object
      required: [key, label, count]
      properties:
        key: { type: string }
        label: { type: string }
        count: { type: integer }
        color: { type: ["string", "null"] }

    AskInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1 }
    AskAnswer:
      type: object
      required: [answer]
      properties:
        answer: { type: string }

    Property:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        pmcName: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        units: { type: ["integer", "null"] }
        accessNotes: { type: ["string", "null"] }
        brief: { type: ["string", "null"] }
        briefUpdatedAt: { type: ["string", "null"] }
        avgDaysToPay: { type: ["number", "null"] }
        status: { type: string }
        createdAt: { type: ["string", "null"] }
    PropertySummary:
      type: object
      required: [id, name, owed, openJobs]
      properties:
        id: { type: string }
        name: { type: string }
        pmcName: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        units: { type: ["integer", "null"] }
        owed: { type: number }
        openJobs: { type: integer }
        marginPct: { type: ["number", "null"] }
    PropertyDetail:
      type: object
      required: [property, contacts, priceItems, jobs, expenses, agreements, stats]
      properties:
        property:
          $ref: "#/components/schemas/Property"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        priceItems:
          type: array
          items:
            $ref: "#/components/schemas/PriceItem"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        agreements:
          type: array
          items:
            $ref: "#/components/schemas/Agreement"
        stats:
          $ref: "#/components/schemas/PropertyStats"
    PropertyStats:
      type: object
      required: [owed, openJobs, marginPct, mtdRevenue]
      properties:
        owed: { type: number }
        openJobs: { type: integer }
        marginPct: { type: ["number", "null"] }
        mtdRevenue: { type: number }
    PropertyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        pmcName: { type: string }
        city: { type: string }
        units: { type: integer }
        accessNotes: { type: string }
    PropertyUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        pmcName: { type: string }
        city: { type: string }
        units: { type: integer }
        accessNotes: { type: string }
        brief: { type: string }
        status: { type: string }

    Contact:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        propertyId: { type: ["string", "null"] }
        name: { type: string }
        role: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        prefers: { type: ["string", "null"] }
    ContactInput:
      type: object
      required: [name]
      properties:
        propertyId: { type: string }
        name: { type: string, minLength: 1 }
        role: { type: string }
        phone: { type: string }
        email: { type: string }
        prefers: { type: string }

    PriceItem:
      type: object
      required: [id, propertyId, service, rate]
      properties:
        id: { type: string }
