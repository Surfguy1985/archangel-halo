        - $ref: "#/components/schemas/CardScheduleAction"
        - $ref: "#/components/schemas/CardReferAction"
        - $ref: "#/components/schemas/CardAcknowledgeAction"
        - $ref: "#/components/schemas/CardDisputeAction"
      discriminator:
        propertyName: action
        mapping:
          approve: "#/components/schemas/CardApproveAction"
          pay_method: "#/components/schemas/CardPayMethodAction"
          dispute: "#/components/schemas/CardDisputeAction"
          schedule: "#/components/schemas/CardScheduleAction"
          refer: "#/components/schemas/CardReferAction"
          acknowledge: "#/components/schemas/CardAcknowledgeAction"

