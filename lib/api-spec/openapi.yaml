openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HALO — Archangel Operations Layer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: today
    description: Today feed, morning brief, computed queues
  - name: properties
    description: Properties, price lists, contacts, agreements
  - name: pipeline
    description: Leads and bids
  - name: jobs
    description: Jobs, schedules, crews
  - name: money
    description: Invoices, payments, expenses, money summary
  - name: inventory
    description: Inventory, vendors, purchase orders
  - name: activity
    description: Activities and notifications
  - name: voice
    description: Voice capture, parsing, and confirmation
  - name: ingest
    description: File upload and parsing
  - name: Storage
    description: File upload and object serving
  - name: crew-portal
    description: Admin-side crew portal, documents, payments
  - name: portal
    description: Public token-gated crew portal
  - name: accounting
    description: Double-entry ledger, journal, and financial reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /today:
    get:
      operationId: getToday
      tags: [today]
      summary: Today feed with triaged queues and morning brief
      responses:
        "200":
          description: Today payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayPayload"

  /brief/refresh:
    post:
      operationId: refreshBrief
      tags: [today]
      summary: Regenerate the AI morning brief from live data
      responses:
        "200":
          description: Fresh brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"

  /queues:
    get:
      operationId: getQueues
      tags: [today]
      summary: The eight computed operational queues
      responses:
        "200":
          description: Queue counts and items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Queue"

  /ask:
    post:
      operationId: askHalo
      tags: [today]
      summary: Ask HALO a natural-language question about the business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAnswer"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties with computed money rollups
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertySummary"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Full property detail — brief, price list, jobs, money, paper, people
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProperty
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property (blocked if it still has jobs)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Has dependent records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /properties/{id}/brief:
    post:
      operationId: writePropertyBrief
      tags: [properties]
      summary: AI-write the property brief from live data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brief written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}/image:
    post:
      operationId: generatePropertyImage
      tags: [properties]
      summary: AI-generate a hero image for the property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /catalog-items:
    get:
      operationId: listCatalogItems
      tags: [properties]
      summary: Master price list — services shared across all properties
      responses:
        "200":
          description: All catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
    post:
      operationId: createCatalogItem
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"

  /catalog-items/{id}:
    patch:
      operationId: updateCatalogItem
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
    delete:
      operationId: deleteCatalogItem
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /properties/{id}/price-items/import:
    post:
      operationId: importPriceItems
      tags: [properties]
      summary: Copy selected master-catalog services into this property's price list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceItemImportInput"
      responses:
        "200":
          description: Imported price items (already-present services are skipped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceItemImportResult"

  /properties/{id}/price-items:
    post:
      operationId: createPriceItem
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceItem"

  /contacts:
    post:
      operationId: createContact
      tags: [properties]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /price-items/{id}:
    patch:
      operationId: updatePriceItem
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceItem"
    delete:
      operationId: deletePriceItem
      tags: [properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /leads:
    get:
      operationId: listLeads
      tags: [pipeline]
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [pipeline]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}/templates:
    get:
      operationId: listLeadEmailTemplates
      tags: [pipeline]
      summary: Rendered follow-up email templates for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Templates rendered with lead/property/company details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadEmailTemplate"
  /leads/{id}/email:
    post:
      operationId: sendLeadEmail
      tags: [pipeline]
      summary: Send a template follow-up email for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadEmailSendInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadEmailSendResult"
  /lead-campaigns:
    get:
      operationId: listLeadCampaignDefs
      tags: [pipeline]
      summary: Available follow-up campaign definitions
      responses:
        "200":
          description: Campaign definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadCampaignDef"
  /leads/{id}/campaign:
    post:
      operationId: startLeadCampaign
      tags: [pipeline]
      summary: Start a follow-up campaign for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCampaignStartInput"
      responses:
        "200":
          description: Updated lead with campaign state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
  /leads/{id}/campaign/stop:
    post:
      operationId: stopLeadCampaign
      tags: [pipeline]
      summary: Stop the active campaign for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /bids:
    get:
      operationId: listBids
      tags: [pipeline]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"
    post:
      operationId: createBid
      tags: [pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
  /bids/{id}:
    get:
      operationId: getBid
      tags: [pipeline]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bid with line items and property/contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidDetail"
    patch:
      operationId: updateBid
      tags: [pipeline]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidDetail"
    delete:
      operationId: deleteBid
      tags: [pipeline]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /bids/{id}/pdf:
    get:
      operationId: getBidPdf
      tags: [pipeline]
      summary: Download the branded bid proposal PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF proposal document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /bids/{id}/send:
    post:
      operationId: sendBid
      tags: [pipeline]
      summary: Email the branded bid proposal PDF to the property contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidSendInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidSendResult"
  /bids/{id}/nudge:
    post:
      operationId: nudgeBid
      tags: [pipeline]
      summary: Send a nudge email for a quiet bid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nudged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: propertyId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateJob
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job and its schedules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/complete:
    post:
      operationId: completeJob
      tags: [jobs]
      summary: Mark a job complete (sets warranty, opens ready-to-invoice)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}/clear:
    post:
      operationId: clearJob
      tags: [jobs]
      summary: Clear a completed job from the active list into job history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job is not complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/restart:
    post:
      operationId: restartJob
      tags: [jobs]
      summary: Restart a completed/cleared job — reopens it and returns it to the active list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{id}/schedule:
    post:
      operationId: scheduleJob
      tags: [jobs]
      summary: Schedule a job for a date and crew leader
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/line-items:
    post:
      operationId: addJobLineItem
      tags: [jobs]
      summary: Attach a price-list item to a job (retail-style line item)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLineItemInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLineItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /job-line-items/{id}:
    patch:
      operationId: updateJobLineItem
      tags: [jobs]
      summary: Update a job line item (quantity)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLineItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLineItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteJobLineItem
      tags: [jobs]
      summary: Remove a line item from a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{id}/recap:
    post:
      operationId: draftJobRecap
      tags: [jobs]
      summary: AI-draft a client-ready work recap from the job's notes and photos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapDraft"
  /jobs/{id}/recap/send:
    post:
      operationId: sendJobRecap
      tags: [jobs]
      summary: Send the recap email to the property contact and stamp recapSentAt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecapSendInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}/recap/share:
    post:
      operationId: createRecapShare
      tags: [jobs]
      summary: Create a public live-link recap page for a job and stamp recapSentAt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
