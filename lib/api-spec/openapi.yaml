    TaxPlannerState:
      type: object
      required: [settings, prefill]
      properties:
        settings: { $ref: "#/components/schemas/TaxPlannerSettingsData" }
        prefill: { $ref: "#/components/schemas/TaxPlannerPrefill" }
    TaxPlannerRunInput:
      type: object
      required: [grossRevenue, ordinaryExpenses]
      properties:
        grossRevenue: { type: number }
        ordinaryExpenses: { type: number }
        settings: { $ref: "#/components/schemas/TaxPlannerSettingsInput" }
    TaxComponentItem:
      type: object
      required: [key, label, amount]
      properties:
        key: { type: string }
        label: { type: string }
        amount: { type: number }
        note: { type: string }
    TaxQuarterlyPayment:
      type: object
      required: [label, dueDate, suggestedPayment]
      properties:
        label: { type: string }
        dueDate: { type: string }
        suggestedPayment: { type: number }
    TaxEstimate:
      type: object
      required:
        [version, taxYear, entityType, businessProfitBeforeOwnerComp,
         ownerPassThroughIncome, ownerW2Wages, adjustedGrossIncomeEstimate,
         deductionUsed, taxableIncomeEstimate, components, federalTaxEstimate,
         stateTaxEstimate, totalProjectedTax, creditsAndPrepayments,
         projectedBalanceDue, effectiveRateOnBusinessProfit,
         reserveRecommendation, quarterlyPayments, assumptions, warnings, disclaimer]
      properties:
        version: { type: string }
        taxYear: { type: integer }
        entityType: { type: string }
        businessProfitBeforeOwnerComp: { type: number }
        ownerPassThroughIncome: { type: number }
        ownerW2Wages: { type: number }
        adjustedGrossIncomeEstimate: { type: number }
        deductionUsed: { type: number }
        taxableIncomeEstimate: { type: number }
        components:
          type: array
          items: { $ref: "#/components/schemas/TaxComponentItem" }
        federalTaxEstimate: { type: number }
        stateTaxEstimate: { type: number }
        totalProjectedTax: { type: number }
        creditsAndPrepayments: { type: number }
        projectedBalanceDue: { type: number }
        effectiveRateOnBusinessProfit: { type: number }
        reserveRecommendation: { type: number }
        quarterlyPayments:
          type: array
          items: { $ref: "#/components/schemas/TaxQuarterlyPayment" }
        assumptions:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        disclaimer: { type: string }
    TaxEntityComparison:
      type: object
      required: [scenarios, lowestProjectedTaxEntity, spread, warning]
      properties:
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/TaxEstimate" }
        lowestProjectedTaxEntity: { type: string }
        spread: { type: number }
        warning: { type: string }
    TaxReport:
      type: object
      required: [year, salesTaxCollected, salesTaxBalance, grossReceipts, scheduleC, totalExpenses, netProfit]
      properties:
        year: { type: integer }
        salesTaxCollected: { type: number }
        salesTaxBalance: { type: number, description: "Sales tax still owed (liability balance)" }
        grossReceipts: { type: number }
        scheduleC:
          type: array
          items:
            type: object
            required: [line, label, amount]
            properties:
              line: { type: string }
              label: { type: string }
              amount: { type: number }
        totalExpenses: { type: number }
        netProfit: { type: number }

    BankTxnMatch:
      type: object
      required: [transactionId, date, name, amount, direction, status]
      properties:
        transactionId: { type: string }
        date: { type: string }
        name: { type: string }
        merchantName: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        amount: { type: number, description: "Positive dollars" }
        direction: { type: string, description: "in or out" }
        status: { type: string, description: "matched | unmatched | imported" }
        matchedEntryNo: { type: ["string", "null"] }
        matchedMemo: { type: ["string", "null"] }
        pending: { type: boolean }

    BankReconciliation:
      type: object
      required: [transactions, matchedCount, unmatchedCount, ledgerCash]
      properties:
        transactions:
          type: array
          items: { $ref: "#/components/schemas/BankTxnMatch" }
        matchedCount: { type: integer }
        unmatchedCount: { type: integer }
        ledgerCash: { type: number }
        truncated:
          type: ["boolean", "null"]
          description: True when older transactions were cut off by the fetch limit

    BankImportInput:
      type: object
      required: [transactionId, date, name, amount, direction]
      properties:
        transactionId: { type: string }
        date: { type: string }
        name: { type: string }
        amount: { type: number }
        direction: { type: string, enum: [in, out] }
        category: { type: string }
